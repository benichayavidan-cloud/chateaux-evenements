name: Bilan du plan intention commerciale

# Bilan avant / après du plan du 06/10/2026, envoyé par email le 17/11/2026.
# Prévu le 03/11 (J+28), reporté le 26/10 : au 26/10 Google n'avait pas revu
# les pages du plan (landing 78 vue le 01/10, landing 60 le 30/08), les
# 28 jours mesurés au 03/11 auraient précédé le changement. Lecture seule.
# Le cron revient chaque 17 novembre : la garde ne laisse passer que 2026.
on:
  schedule:
    - cron: "0 7 17 11 *"   # 17/11, 08h00 Paris (heure d'hiver)
  workflow_dispatch:

jobs:
  bilan:
    runs-on: ubuntu-latest
    steps:
      - name: Garde (déclenchement planifié en 2026 seulement)
        id: garde
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "Bilan déjà rendu en 2026 — rien à faire"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.garde.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.garde.outputs.go == 'true'
        with: { node-version: 22 }
      - name: Bilan
        if: steps.garde.outputs.go == 'true'
        working-directory: scripts/agent-seo
        run: |
          npm install --omit=dev --no-audit --no-fund
          node bilan-plan.mjs
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
