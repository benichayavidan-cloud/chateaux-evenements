name: Camille — Blog SEO + GEO Agent

on:
  schedule:
    # Toutes les heures — le pipeline vérifie jour + heure dans Supabase agent_controls
    - cron: "0 * * * *"
  workflow_dispatch:

# Un lancement manuel qui chevauche le passage horaire partirait du même HEAD :
# le second push échouerait. Un seul passage à la fois, sans annuler l'autre.
concurrency:
  group: camille
  cancel-in-progress: false

jobs:
  camille:
    runs-on: ubuntu-latest
    # 30 et non 15 : depuis le ratio 3/1 un run rédige 3 ou 4 articles de
    # ~2 000 mots. Mesuré au 1er run réel du 07/09 : ~4 min par article, plus
    # le npm ci et le pull GSC. Le plafond de 15 min, hérité du temps où
    # l'agent produisait 2 articles, a annulé ce run en pleine rédaction.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/agent-cm/package-lock.json

      - name: Install dependencies
        working-directory: scripts/agent-cm
        run: npm ci

      - name: Run pipeline
        id: pipeline
        working-directory: scripts/agent-cm
        run: node pipeline.js | tee /tmp/pipeline-result.json
        env:
          # Camille lit les issues « camille-reecriture » ouvertes par Marcus
          # (priorité 0 de sa sélection de réécritures).
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Validate images
        run: node scripts/agent-cm/validate-images.js

      # GARDE-FOU AVANT COMMIT. Le 18/09/2026 un commit de Camille a laissé
      # blog-posts-camille.ts sans sa fermeture `];` : main n'a plus compilé
      # pendant deux jours, sans alerte. Depuis le 24/09 Camille réécrit aussi
      # les articles des trois autres fichiers de données : on vérifie donc
      # les quatre, puis le typage du site entier. Si l'une de ces étapes
      # échoue, le job s'arrête ici : rien n'est commité, aucune demande de
      # réécriture n'est close (elle sera reprise au passage suivant).
      - name: Vérifier les fichiers de données (syntaxe, aucun article perdu)
        run: node scripts/agent-cm/verif-donnees.js

      - name: Vérifier le typage du site (tsc --noEmit)
        run: |
          if git diff --quiet -- src/data; then
            echo "Aucun fichier de données modifié — typage non relancé"
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit and push
        run: |
          git config user.name "Camille (Blog Agent)"
          git config user.email "camille@selectchateaux.com"
          # Les QUATRE fichiers : une réécriture modifie l'article là où il vit.
          git add src/data/blog-posts*.ts public/images/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            SLUGS=$(node -e "try{const r=JSON.parse(require('fs').readFileSync('/tmp/pipeline-result.json','utf8').split('\n').filter(l=>l.startsWith('{')).pop());const c=(r.slugs||[]).length,w=(r.rewritten||[]).length;console.log([w?w+' réécriture(s) : '+r.rewritten.join(', '):null,c?'création : '+r.slugs.join(', '):null].filter(Boolean).join(' | ')||'daily')}catch{console.log('daily')}")
            git commit -m "feat(blog): ${SLUGS} — Agent Camille $(date -u +%Y-%m-%d)"
            git push origin main
            echo "Publié et pushé !"
          fi

      # APRÈS le push seulement : une demande de Marcus n'est close que si la
      # réécriture est réellement publiée. Non bloquant — une demande restée
      # ouverte par erreur est rattrapée au run suivant (pipeline.js,
      # trierCommandes : article déjà réécrit depuis la demande → close).
      - name: Fermer les demandes de réécriture traitées
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/agent-cm/fermer-commandes.js /tmp/pipeline-result.json || echo "::warning::Fermeture des demandes échouée (rattrapée au prochain run)"

      - name: Ping IndexNow
        run: |
          # Créations ET réécritures : une réécriture doit être re-crawlée,
          # c'est tout l'objet de l'opération. Ne pinger que les créations
          # aurait rendu le ping muet les jours de réécriture seule — c'est-à-dire
          # le régime normal depuis le 06/09/2026.
          SLUGS=$(node -e "try{const r=JSON.parse(require('fs').readFileSync('/tmp/pipeline-result.json','utf8').split('\n').filter(l=>l.startsWith('{')).pop());console.log([...(r.slugs||[]),...(r.rewritten||[])].join(' '))}catch{console.log('')}")
          if [ -z "$SLUGS" ]; then
            echo "Aucun article publié ni réécrit — pas de ping IndexNow"
            exit 0
          fi
          # Le push déclenche l'auto-deploy Vercel — attendre que le 1er article soit en ligne avant de pinger
          FIRST=$(echo $SLUGS | cut -d' ' -f1)
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://www.selectchateaux.com/blog/$FIRST")
            if [ "$CODE" = "200" ]; then
              echo "Article en ligne après ${i}0s"
              break
            fi
            echo "Tentative $i/30 — HTTP $CODE, on attend le deploy Vercel..."
            sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "::warning::Article pas en ligne après 5 min — ping IndexNow annulé (à refaire manuellement : node scripts/indexnow-ping.js /blog/$FIRST)"
            exit 0
          fi
          PATHS=$(for s in $SLUGS; do echo -n "/blog/$s "; done)
          node scripts/indexnow-ping.js $PATHS || echo "::warning::Ping IndexNow échoué (non-fatal)"

      - name: Summary
        if: always()
        run: |
          echo "## Camille Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Articles file**: $(wc -c < src/data/blog-posts-camille.ts) bytes" >> $GITHUB_STEP_SUMMARY
          echo "- **Blog images**: $(ls public/images/*.webp 2>/dev/null | wc -l) files" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/pipeline-result.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            tail -1 /tmp/pipeline-result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
