name: Audit — Lighthouse (ponctuel)

# Mesure Lighthouse depuis un runner neutre (le Mac local fausse les mesures et
# l'API PageSpeed sans clé renvoie 429). Lecture seule. Artefact `audit-lighthouse`.
on:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse (5 pages mobile + accueil desktop)
        run: |
          mkdir -p /tmp/lh
          npm i -g lighthouse@12.8.2 >/dev/null 2>&1
          i=0
          for u in "https://www.selectchateaux.com/" "https://www.selectchateaux.com/chateaux" "https://www.selectchateaux.com/team-building-chateau" "https://www.selectchateaux.com/seminaire-chateau-seine-et-marne-77" "https://www.selectchateaux.com/blog/combien-coute-seminaire-chateau-2026"; do
            i=$((i+1))
            lighthouse "$u" --output=json --output-path=/tmp/lh/p$i-mobile.json --only-categories=performance,seo,accessibility,best-practices --chrome-flags="--headless=new --no-sandbox" --quiet || echo "KO $u mobile"
            if [ $i = 1 ]; then lighthouse "$u" --output=json --output-path=/tmp/lh/p$i-desktop.json --preset=desktop --only-categories=performance,seo,accessibility,best-practices --chrome-flags="--headless=new --no-sandbox" --quiet || echo "KO $u desktop"; fi
          done
          cd /tmp/lh && for f in *.json; do jq -c '{url: .finalDisplayedUrl, mode: .configSettings.formFactor, scores: (.categories | map_values((.score*100)|round)), lcp_s: (.audits["largest-contentful-paint"].numericValue/1000), cls: .audits["cumulative-layout-shift"].numericValue, tbt_ms: .audits["total-blocking-time"].numericValue, fcp_s: (.audits["first-contentful-paint"].numericValue/1000), speed_index_s: (.audits["speed-index"].numericValue/1000), lcp_element: (.audits["largest-contentful-paint-element"].details.items[0].items[0].node.snippet // null), opportunites: [.audits | to_entries[] | select(.value.details.type=="opportunity" and (.value.numericValue // 0) > 150) | {id: .key, ms: .value.numericValue, titre: .value.title}], diagnostics_seo_ko: [.categories.seo.auditRefs[].id as $id | .audits[$id] | select(.score != null and .score < 1) | {id: .id, titre: .title}]}' "$f"; done | jq -s '.' > /tmp/lighthouse.json
          jq '.[] | {url, mode, scores, lcp_s}' /tmp/lighthouse.json
      - uses: actions/upload-artifact@v4
        with:
          name: audit-lighthouse
          path: /tmp/lighthouse.json
          retention-days: 7
